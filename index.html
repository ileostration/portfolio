<div class="lp" style="position:relative;width:100%;min-height:100vh;overflow:hidden;background:#101014;color:#F7F2E7;">

  <!-- full-color background, animated transition on hover: no text, no imagery -->
  <div class="lp-bg" style="position:absolute;inset:0;background-color:{{bgColor}};"></div>

  <!-- legibility scrim over the left column -->
  <div style="position:absolute;inset:0;background:linear-gradient(100deg, rgba(10,9,7,0.86) 0%, rgba(10,9,7,0.62) 32%, rgba(10,9,7,0.22) 58%, rgba(10,9,7,0) 75%);pointer-events:none;"></div>

  <div style="position:relative;display:flex;min-height:100vh;width:100%;">

    <!-- left column: name, title, statement, project nav -->
    <div style="width:min(420px, 40vw);min-width:300px;display:flex;flex-direction:column;justify-content:center;padding:56px 40px;gap:40px;">
      <div>
        <h1 class="lp-name" style="margin:0;line-height:1.02;">
          <span style="display:block;font-size:clamp(40px,6vw,64px);font-weight:600;">Leo</span>
          <span style="display:block;font-family:'Work Sans',sans-serif;font-size:15px;font-weight:500;letter-spacing:0.02em;color:rgba(247,242,231,0.86);margin-top:14px;">Creative Director · UI/UX Expert · Professional Designer</span>
        </h1>
        <p style="margin:18px 0 0;font-size:15px;line-height:1.6;color:rgba(247,242,231,0.68);max-width:320px;">I design brand identity and product interfaces — creative direction through to UI/UX — for problems too complex to solve at a glance.</p>
      </div>

      <nav aria-label="Selected work" sc-camel-on-mouse-leave="{{resetToIdle}}">
        <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(247,242,231,0.55);margin-bottom:16px;">Selected Work</div>
        <ul style="display:flex;flex-direction:column;">
          <sc-for list="{{items}}" as="p" hint-placeholder-count="5">
            <li style="position:relative;">
              <a class="lp-navlink" href="{{p.url}}" target="_blank" rel="noopener noreferrer" sc-camel-on-mouse-enter="{{p.onEnter}}" sc-camel-on-focus="{{p.onFocus}}" sc-camel-on-click="{{p.onClick}}" style="position:relative;display:block;margin:0 -40px;padding:10px 40px;">
                <span style="position:absolute;inset:0;background:linear-gradient(90deg, {{p.hlColor}} 0%, transparent 82%);opacity:{{p.hlOpacity}};transition:opacity 260ms ease;pointer-events:none;"></span>
                <span style="position:relative;display:block;font-size:19px;font-weight:500;color:{{p.navColor}};transition:color 220ms ease;">{{p.name}}</span>
                <span style="position:relative;display:block;margin-top:3px;font-size:13px;color:rgba(247,242,231,0.55);max-width:280px;">{{p.tagline}}</span>
              </a>
            </li>
          </sc-for>
        </ul>
      </nav>
    </div>

    <div style="flex-grow:1;"></div>
  </div>

  <span aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">
    <sc-if value="{{hasSelection}}" hint-placeholder-val="{{false}}">Previewing {{current.name}}</sc-if>
  </span>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);

    const IDLE_BG = "#101014";
    this.IDLE_BG = IDLE_BG;

    this.projects = [
      {
        id: "hullo",
        name: "Hullo",
        tagline: "Brand identity for an AI receptionist that answers calls, books jobs and logs the details for local service businesses.",
        url: "/work/hullo/",
        color: "#E9C46A"
      },
      {
        id: "evenkeel",
        name: "Evenkeel",
        tagline: "Product design for an app that turns irregular income into a steady, predictable paycheck.",
        url: "/work/evenkeel/",
        color: "#2A9D8F"
      },
      {
        id: "kern",
        name: "Kern Studio",
        tagline: "Brand identity and website for a design studio, built around a confident wordmark and a grid system that mirrors how they work.",
        url: "/work/kern/",
        color: "#264653"
      },
      {
        id: "meridian",
        name: "The Meridian Biennial",
        tagline: "Exhibition identity and wayfinding for a seven-venue contemporary art biennial.",
        url: "/work/meridian/",
        color: "#E76F51"
      },
      {
        id: "farpoint",
        name: "Far Point S1",
        tagline: "Onboarding and information design for a home smart telescope, guiding first-time users to their first image of the sky.",
        url: "/work/far-point/",
        color: "#F4A261"
      }
    ];

    this.projects.forEach(function (p) {
      p.hlColor = p.color + "38";
    });

    this.state = {
      active: -1,
      bgColor: IDLE_BG,
      isTouch: false
    };

    this.showProject = this.showProject.bind(this);
  }

  componentDidMount() {
    try {
      const isTouch = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
      this.setState({ isTouch: isTouch });
    } catch (e) {}
  }

  showProject(i) {
    const p = i === -1 ? null : this.projects[i];
    const color = p ? p.color : this.IDLE_BG;
    this.setState({ active: i, bgColor: color });
  }

  handleClick(i, e) {
    if (this.state.isTouch && this.state.active !== i) {
      e.preventDefault();
      this.showProject(i);
    }
  }

  renderVals() {
    const active = this.state.active;
    const self = this;

    const items = this.projects.map(function (p, i) {
      const isActive = active === i;
      return {
        name: p.name,
        tagline: p.tagline,
        url: p.url,
        hlColor: p.hlColor,
        hlOpacity: isActive ? 1 : 0,
        navColor: isActive ? "#F2C879" : "#F7F2E7",
        onEnter: function () { self.showProject(i); },
        onFocus: function () { self.showProject(i); },
        onClick: function (e) { self.handleClick(i, e); }
      };
    });

    const current = active === -1 ? null : this.projects[active];

    return {
      items: items,
      hasSelection: active !== -1,
      current: current,
      bgColor: this.state.bgColor,
      resetToIdle: function () { self.showProject(-1); }
    };
  }
}
</script>
